- name: Setup system-D service file
  ansible.builtin.copy:
    src: "{{ app_name }}.service"
    dest: /etc/systemd/system/{{ app_name }}.service

- name: Reload SystemD daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Start Application
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: restarted
    enabled: true